    # 数量参数组；分段入口由分段文件控制每格数量和拆单，不能用执行文件旧数量表推算本策略仓位。
    quantity_config:
      # 每格目标数量 0.5 BNB；fixed 模式最多两层，不随账户余额自动调整，另受每币每所 1000 USDC 上限约束。
      base_quantity: 0.5
      # 每次实际拆单最多 0.25 BNB（半格）；quantity_config 中本字段优先于 grid_config。
      split_order_size: 0.25
      # 数量模式；fixed 使用 base_quantity，value 按 target_value_usdc 与价格折算。当前全部为 fixed。
      quantity_mode: fixed
      # 数量允许的小数位数；不是价格精度，还须符合市场步长和最小下单限制。
      quantity_precision: 2
      # value 模式的目标名义价值，单位 USDC；当前 fixed 模式不以此金额重新计算下单数量。
      target_value_usdc: 500.0
      # 各交易所最低基础数量；指定交易所优先，缺失时用 default，并同时检查 market_constraints。
      min_exchange_order_qty:
        # 最低基础数量的回退值；未单独列出的交易所使用此值。
        default: 0.01
        # 最低基础数量的lighter 专用值；优先于 default。
        lighter: 0.01
        # 最低基础数量的arcus 专用值；优先于 default。
        arcus: 0.001
# 本地市场数量/名义金额约束，执行前检查；这是配置快照，不会自动同步交易所最新规则。
market_constraints:
  # BTC 市场约束；与上方币种数量参数共同检查。
  BTC:
    # 下单数量步长；引号内是精确十进制字符串，执行校验时转换，必须保持格式与类型。
    quantity_step: '.00001'
    # 该币种最低基础数量；不是美元金额，另须满足各所最低名义金额。
    min_quantity: '.0001'
    # 各交易所每腿最低名义金额，单位 USDC；订单数量×价格不足时拒绝，不自动放大数量。
    min_notional_by_exchange:
      # lighter 每腿最低名义金额，单位 USDC；当前 10 USDC。
      lighter: 10
      # arcus 每腿最低名义金额，单位 USDC；当前 5 USDC。
      arcus: 5

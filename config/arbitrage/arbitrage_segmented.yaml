# ===== 2x 杠杆方案（每所 5000U，名义上限 10000U）=====
# 相对原 5000U 方案：阶梯按各币当前价差重标定（6层），仓位放大至约2倍权益，关闭BNB。
# 约单边10%只平不开、17%强制平仓、交易所强平约45%（估算）。T1需随两所天然价差变化定期重标定。
# 5000 USDC/所方案（2026-10-14，仅本地）：钱包每边 5000；每所累计名义上限 5000、每币每所上限 1000，均仅限制新增开仓。
# 五币固定数量、每币最多两层、每次拆半层；同时受账户 total×1 动态上限约束，名义上限不是保证金或最大亏损。
# 保持 Lighter/Arcus 双市价与现有费用、持续性、退出和未知订单保护；余额警告/禁止开仓线 4500，严重不足线 4000 USDC。
# 中文研究说明（仅本地注释，2026-10-11）：本文件负责当前统一分段策略、启动持仓核对和分段风控。
# scripts/start_lighter_arcus.sh 默认 monitor，仅在临时副本覆盖 monitor_only；显式 live 才允许真实执行。
# 每币配置覆盖 default_config 的对应字段；订单模式/限速从 arbitrage_lighter_arcus.yaml 加载，监控从 monitor_lighter_arcus.yaml 加载。
# 数值单位须看每项：价差 0.08 表示 0.08%，手续费/滑点比例 0.001 表示 0.1%；数量是基础合约数量，价值是 USDC 名义金额。
# 下述“当前”指本地代码与配置快照，不能推断服务器已部署；不保证盈利或止损成交上限。
# 实现核对入口：config/symbol_config.py、core/unified_orchestrator_*、decision/unified_decision_engine.py（均在 arbitrage_monitor_v2 下）。
# Arcus public market minima verified 2026-10-11; fees assume Lighter Standard.
# 运行模式与数据检查；当前分段入口以 arbitrage_segmented.yaml 的此节为准。
system_mode:
  # true 表示监控模式，不发送策略真实订单；启动脚本在临时副本中按 monitor/live 覆盖此值。
  monitor_only: true
  # 行情最大允许年龄，单位秒；过旧报价不用于正常决策。分段入口使用分段文件的 2.5 秒。
  data_freshness_seconds: 2.5
  # true 启动时查询并核对真实持仓，尝试恢复可识别的配对状态；不是无条件接管任何旧仓。
  bootstrap_positions_on_startup: true
  # true 在启动持仓核对成功前锁住新开仓；失败不应视为空仓。
  bootstrap_positions_block_open_until_success: true
  # 启动单次持仓查询等待时间，单位秒；30 秒超时后进入失败/重试处理。
  bootstrap_positions_fetch_timeout_seconds: 30
  # 启动核对失败后的重试间隔，单位秒；当前 10 秒。
  bootstrap_positions_retry_interval_seconds: 10
  # 启动核对重试次数参数；当前 5 次，耗尽后保留失败状态/开仓闭锁，不保证成功。
  bootstrap_positions_retry_max_attempts: 5
  # 空仓确认总轮数，包含首轮；当前 10 轮（首轮后最多追加 9 轮），核对余额、挂单、持仓快照。
  bootstrap_positions_empty_confirm_attempts: 10
  # 追加空仓确认间隔，单位秒；当前 1 秒。
  bootstrap_positions_empty_confirm_interval_seconds: 1
  # true 启动时两腿不匹配则阻止新开仓；不自动消除真实敞口。
  bootstrap_positions_block_open_on_mismatch: true
  # 两腿数量核对容差，单位基础数量；实际比较取本值与引擎 quantity_epsilon 的较大者，0 不关闭检查。
  bootstrap_positions_qty_tolerance: 0
# 分段决策的费用估算设置；不等于旧 V3 的 arbitrage_decision。
decision:
  # 是否在分段开仓净价差判定中扣除估算开平仓费用；true 开启，不代表保证净盈利。
  deduct_fees: true
  # 按交易所配置估算费率；分段此表按交易所覆盖执行配置 exchange_fees 的同名项。
  exchange_fee_config:
    # 未单列交易所或币种时的回退设置。
    default:
      # 限价单估算费率，单位为小数比例（0.0001=0.01%）；0 表示按零费用估算，非账户实际费率证明。
      limit_fee_rate: 0
      # 市价单估算费率，单位为小数比例；0.000225=0.0225%，0 表示按零费用估算；实际收费须以成交对账为准。
      market_fee_rate: 0
    # lighter 专用设置；同组内优先于 default。
    lighter:
      # 限价单估算费率，单位为小数比例（0.0001=0.01%）；0 表示按零费用估算，非账户实际费率证明。
      limit_fee_rate: 0
      # 市价单估算费率，单位为小数比例；0.000225=0.0225%，0 表示按零费用估算；实际收费须以成交对账为准。
      market_fee_rate: 0
    # arcus 专用设置；同组内优先于 default。
    arcus:
      # 限价单估算费率，单位为小数比例（0.0001=0.01%）；0 表示按零费用估算，非账户实际费率证明。
      limit_fee_rate: 0
      # 市价单估算费率，单位为小数比例；0.000225=0.0225%，0 表示按零费用估算；实际收费须以成交对账为准。
      market_fee_rate: 0.000225
# 风险控制参数组；具体生效范围见下方各节说明。
risk_control:
  # 账户余额监控；分段入口使用分段文件本节，严重不足优先于普通警告检查。
  balance_management:
    # 每所 USDC 余额警告线 4500；低于此线触发低余额处理，低于严重线 4000 时优先走严重不足分支。
    min_balance_warning: 4000.0  # 2x方案：原 4500.0；权益<4000只平不开前预警
    # 每所严重余额不足线 4000 USDC；低于此线触发严重余额处理及已绑定的受控平仓回调，不保证立即全部成交。
    min_balance_close_position: 3300.0  # 2x方案：原 4000.0；2x下约单边17%触发强制平仓
    # 严重余额不足的平仓方式；grid_sequential 表示按网格顺序受控减仓，仍受订单状态与安全检查约束。
    force_close_mode: grid_sequential
    # 本组检查周期，单位秒；不是逐笔成交超时。
    check_interval: 10
    # 是否请求声音告警；true 开启、false 关闭，是否听到取决于终端环境。
    sound_alarm_enabled: true
  # 只限制新增开仓的守卫；满足低账户余额、仓位价值或波动条件时保留受控平仓路径。
  open_only_close:
    # 按 UI 账户缓存的 USDC/USD total 检查开仓准入：Arcus 为权益，Lighter 为抵押品；不统一等同权益。
    low_balance:
      # 本组开关；true 为启用。
      enabled: true
      # 每所上述账户 total 字段的最低门槛 4500 USDC；低于阈值阻止新增开仓；缺 total 时回退 free+used。
      min_equity_usdc: 4000.0  # 2x方案：原 4500.0；2x下约单边10%只平不开
      # 是否请求声音告警；true 开启、false 关闭，是否听到取决于终端环境。
      sound_alarm_enabled: true
      # 按交易所覆盖上述账户 total 字段的最低门槛；空字典表示全部使用 min_equity_usdc。
      min_equity_usdc_by_exchange: {}
    # 每所持仓名义价值静态上限，控制新增开仓，不是本金或最大亏损。
    max_exchange_position_value:
      # 本组开关；true 为启用。
      enabled: true
      # 每所全部币种累计名义持仓价值上限 5000 USDC；实时已有仓位加本单超过限制时禁止新增开仓，不是保证金或最大亏损。
      max_value_usdc: 10000.0  # 2x方案：原 5000.0；每所累计名义上限=权益约2倍
      # 是否请求声音告警；true 开启、false 关闭，是否听到取决于终端环境。
      sound_alarm_enabled: false
      # 按交易所覆盖静态仓位价值上限；空字典表示使用统一 max_value_usdc。
      max_value_usdc_by_exchange: {}
    # 以上述账户 total 字段（Arcus 权益/Lighter 抵押品）乘倍数得到动态仓位价值限制；与静态上限共同约束新增开仓。
    dynamic_max_exchange_position_value:
      # 本组开关；true 为启用。
      enabled: true
      # 动态名义价值上限=上述账户 total 字段×此倍数；1.0 是倍数，不是 1.0%，也不会设置交易所杠杆。
      equity_multiplier: 2.0  # 2x方案：原 1.0；动态上限=账户total×2
    # 触发币种的窗口内价格振幅守卫；达到阈值后暂时禁止新增开仓。
    price_volatility:
      # 用这些基础币种的价格检测波动；此列表不等于完整交易币种列表。
      trigger_symbols:
      # 本列表中的交易所/币种标识，按原顺序保留。
      - BTC
      # 本列表中的交易所/币种标识，按原顺序保留。
      - ETH
      # 本列表中的交易所/币种标识，按原顺序保留。
      - SOL
      # 本组开关；true 为启用。
      enabled: true
      # 本守卫的滚动统计窗口，单位秒；只统计该组对应的事件或价格。
      window_seconds: 300
      # 价格振幅阈值，单位百分比数值；3 表示 3%，不是 300%。
      threshold_pct: 3
      # 波动触发后的禁止开仓时长，单位秒；1800=30 分钟。
      block_seconds: 900  # 2x方案：原 1800；大波动后暂停开仓15分钟
      # true 表示触发后对全部币种限制开仓；false 仅针对触发币种。
      apply_to_all_symbols: true
      # 是否请求声音告警；true 开启、false 关闭，是否听到取决于终端环境。
      sound_alarm_enabled: true
  # 连续执行失败触发全局暂停；暂停与只开仓守卫不同，可能阻止正常开平仓。
  execution_pause:
    # 本组开关；true 为启用。
    enabled: true
    # 此组累计失败触发门槛，单位次；计数口径分别由执行失败/API 失败逻辑处理。
    consecutive_failures: 3
    # 执行失败后的暂停时长，单位分钟；45=2700 秒。
    pause_minutes: 45
  # 成交后滑点触发暂停；这是事后风控，不是下单前保护价或亏损封顶。
  slippage_pause:
    # 本组开关；true 为启用。
    enabled: true
    # 不利滑点阈值，百分比数值；0.08 表示 0.08%，触发后使用本组暂停时长。
    negative_slippage_threshold_pct: 0.08
    # 本组触发后的暂停时长，单位秒；实际恢复还须满足其他安全条件。
    pause_seconds: 900
    # 本组重复触发或执行的冷却时间，单位秒；避免短时间反复触发。
    cooldown_seconds: 60
    # 是否将开仓成交滑点纳入本组检查；true 纳入。
    apply_to_open: true
    # 是否将平仓成交滑点纳入本组检查；true 纳入，触发可能影响后续正常平仓。
    apply_to_close: true
    # 滚动窗口内多次负滑点触发暂停的附加规则。
    burst_negative_slippage_pause:
      # 本组开关；true 为启用。
      enabled: true
      # 本守卫的滚动统计窗口，单位秒；只统计该组对应的事件或价格。
      window_seconds: 180
      # 窗口内达到的事件次数门槛；不等于累计终身成交次数。
      count_threshold: 5
    # 近若干成功成交出现高滑点时请求重连的规则；当前关闭，不是强制平仓。
    high_slippage_reconnect:
      # 本组开关；false 为关闭，本组其余参数暂不触发该功能。
      enabled: false
      # 统计最近的成功成交样本数量，单位次；仅本重连规则开启时有意义。
      window_trades: 10
      # 窗口内达到的事件次数门槛；不等于累计终身成交次数。
      count_threshold: 5
      # 高滑点计数阈值，百分比数值；0.01 表示 0.01%，当前重连规则关闭。
      high_slippage_threshold_pct: 0.01
      # 本组重复触发或执行的冷却时间，单位秒；避免短时间反复触发。
      cooldown_seconds: 300
  # API 失败暂停规则；当前关闭，本节参数不启用该暂停，其他账户异常检查仍可拦截开仓。
  api_failure_pause:
    # 本组开关；false 为关闭，本组其余参数暂不触发该功能。
    enabled: false
    # 此组累计失败触发门槛，单位次；计数口径分别由执行失败/API 失败逻辑处理。
    consecutive_failures: 10
    # 同一交易所失败计数的最小间隔，单位秒；用于计数节流，不是所有 API 的请求间隔。
    min_interval_seconds: 30
    # 本守卫的滚动统计窗口，单位秒；只统计该组对应的事件或价格。
    window_seconds: 600
    # 本组触发后的暂停时长，单位秒；实际恢复还须满足其他安全条件。
    pause_seconds: 900
  # 订单 WebSocket 成交回报延迟的暂停规则；不代表所有行情 WebSocket 延迟。
  order_ws_latency_pause:
    # 本组开关；true 为启用。
    enabled: true
    # 订单回报延迟触发线，单位秒；当前 3.2 秒。
    threshold_seconds: 3.2
    # 本组触发后的暂停时长，单位秒；实际恢复还须满足其他安全条件。
    pause_seconds: 1000
    # 该延迟暂停是否同时阻止自动纠偏；false 不额外阻止，但自动纠偏总开关当前仍关闭。
    block_position_alignment_auto_fix: false
  # 持仓复核不一致时自动下单纠偏；当前关闭，不能视为会自动修复残腿。
  position_alignment_auto_fix:
    # 本组开关；false 为关闭，本组其余参数暂不触发该功能。
    enabled: false
    # 本组重复触发或执行的冷却时间，单位秒；避免短时间反复触发。
    cooldown_seconds: 15
    # 纠偏滚动窗口允许的最多执行次数；当前 3 次，0 表示不设此次数限制，开关关闭时不执行。
    max_executions_per_window: 3
    # 本守卫的滚动统计窗口，单位秒；只统计该组对应的事件或价格。
    window_seconds: 14400
  # 持仓持续不一致触发全局暂停；暂停不会自动修正账户仓位。
  position_mismatch_pause:
    # 本组开关；true 为启用。
    enabled: true
    # 持续不一致的触发时间，单位秒；当前 10 秒。
    mismatch_seconds: 10
# 订单等待、重试与保护参数组；注意分段文件同名根节的消费边界。 当前统一入口未找到对分段根 order_execution 的读取；实际执行使用执行文件 arbitrage_execution.order_execution。
order_execution:
  # 限价单等待超时，单位秒；超时进入撤单/状态确认等处理，不保证此时已完成平仓。 当前统一入口未找到对分段根 order_execution 的读取；实际执行使用执行文件 arbitrage_execution.order_execution。
  limit_order_timeout: 10
  # Lighter 市价单成交状态等待上限，单位秒；超时不等于确认未成交。 当前统一入口未找到对分段根 order_execution 的读取；实际执行使用执行文件 arbitrage_execution.order_execution。
  lighter_market_order_timeout: 10
  # 一般执行重试次数参数；未知成交状态受保护，不代表可盲目重复发单。 当前统一入口未找到对分段根 order_execution 的读取；实际执行使用执行文件 arbitrage_execution.order_execution。
  max_retry_count: 3
# 各币种的默认分段配置；symbol_configs 按同名分组字段覆盖，未写的字段继承这里。
default_config:
  # 以下默认初始门槛 0.03%、阶梯 0.03 个百分点及 5 层均被当前五币覆盖，未用于这五币的实际网格。
  # 开平仓阶梯、持续性、盘口和价格保护设置；价差参数通常使用百分比数值。
  grid_config:
    # 第 1 格开仓门槛，单位百分比数值（0.08=0.08%）；当前 deduct_fees=true，比较扣估算往返费用后的价差，还须通过其他守卫。
    initial_spread_threshold: 0.03
    # 相邻阶梯的价差增量，单位百分点；第 n 格门槛=初始门槛+(n−1)×本值。
    grid_step: 0.03
    # 最多目标网格层数，单位格；与每格 base_quantity 共同确定目标数量，不是美元额度。
    max_segments: 5
    # 每次实际拆单的数量上限，单位为本币合约基础数量；quantity_config 中本字段优先于 grid_config。
    split_order_size: 1.0
    # 剥头皮模式开关；当前 false，相关触发格数和剥头皮止盈参数暂不启用。
    scalping_enabled: false
    # 达到该网格层数后才考虑剥头皮；当前总开关关闭。
    scalping_trigger_segment: 10
    # 剥头皮盈利触发阈值，百分比数值；0.02=0.02%，仅 scalping_enabled 开启时参与。
    scalping_profit_threshold: 0.02
    # 已加载的旧平仓模式字段；当前统一网格路径不按此值切换，实际使用首格 initial×0.4、其余前一格门槛。
    use_symmetric_close: true
    # 旧非对称平仓目标差值，单位百分点（0.045 表示 0.045 个百分点）；当前统一网格路径不消费此字段。
    profit_per_segment: 0.045
    # 已加载的旧剥头皮阈值字段，单位百分比数值；当前统一决策入口未找到消费，不要混同 scalping_profit_threshold。
    scalp_profit_threshold: 0.02
    # 价差须持续满足的观察窗口，单位秒；当前分段默认 3 秒，具体还受严格检查和采样覆盖约束。
    spread_persistence_seconds: 2  # 2x方案：原 3；持续2秒即可开/平
    # true 使用严格持续性检查；不能仅凭窗口内某一瞬间越线开仓。
    strict_persistence_check: true
    # 是否校验对手盘可用数量；true 开启，盘口不足时拦截对应执行。
    require_orderbook_liquidity: true
    # 对手盘最小数量要求，单位为该币基础数量，不是 USDC；与实际订单需求共同检查。
    min_orderbook_quantity: 0.01
    # 用于价格/深度聚合的盘口档数；1 为最优一档，不具备多档数据的来源不能据此生成多档。
    orderbook_aggregate_levels: 3  # 2x方案：原 1；前3档合计校验深度
    # 跳过深度检查的交易所名单；空列表表示没有显式豁免。
